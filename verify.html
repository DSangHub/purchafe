<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Purchafe Safe Verification</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-950 min-h-screen flex items-center justify-center p-6"><main class="bg-white rounded-3xl p-8 max-w-lg w-full shadow-2xl"><div class="text-blue-600 font-bold text-xl mb-2">PURCHAFE SAFE™</div><h1 class="text-3xl font-bold mb-6">Purchase Verification</h1><div id="result" class="text-gray-600">Checking Purchafe Safe record…</div></main><script>async function verify(){const token=new URLSearchParams(location.search).get('token');const box=document.getElementById('result');if(!token){box.innerHTML='<b class="text-red-600">INVALID</b><p>Verification token is missing.</p>';return}try{const r=await fetch('/api/safe/verify?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok){box.innerHTML='<b class="text-red-600">NOT VERIFIED</b><p>This Purchafe Safe record could not be verified.</p>';return}const ok=d.status==='ACTIVE';box.innerHTML='<div class="text-2xl font-bold '+(ok?'text-emerald-600':'text-amber-600')+'">'+d.status+'</div><div class="mt-5 space-y-2"><p><b>Safe ID:</b> '+d.safeId+'</p><p><b>Factory barcode/serial:</b> '+d.factorySerial+'</p><p><b>Merchant:</b> '+(d.merchantName||'Not recorded')+'</p><p><b>Purchase date:</b> '+new Date(d.purchaseDate).toLocaleDateString()+'</p></div><p class="mt-6 text-sm text-gray-500">Owner name, address, receipt data and notes are intentionally private.</p>'}catch(e){box.innerHTML='<b class="text-red-600">SERVICE ERROR</b><p>Please try again.</p>'}}verify();</script></body></html>
